name: Weekly Taiwan House Listings Sync

on:
  schedule:
    # Every Monday 09:00 Asia/Taipei (UTC+8 = 01:00 UTC)
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-property-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run browser-based listing sync
        run: python scripts/sync_listings.py

      - name: Commit data, backups and report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data backups reports logs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Weekly property listings update"
            git push
          fi

      - name: Record failed run
        if: failure()
        run: |
          echo "Property synchronization failed. Existing published listings were not intentionally replaced." >> "$GITHUB_STEP_SUMMARY"
